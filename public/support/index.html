<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Support for projects by Ramazan Turan." />
  <title>Support | Ramazan Turan</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 16px;
      color: #475569;
    }

    p:last-child {
      margin-bottom: 0;
    }

    a {
      color: #2563eb;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main>
    <h1>Support</h1>
    <p>If you need help with any of my projects, have found a problem, or would like to share feedback, please contact me by email.</p>
    <p><a href="mailto:ramazanturan.dev@gmail.com">ramazanturan.dev@gmail.com</a></p>
    <p>Please include the project name and a short description of your request.</p>
  </main>
</body>
</html>
